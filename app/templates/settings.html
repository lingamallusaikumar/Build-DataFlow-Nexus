{% extends "base.html" %}
{% block header %}Global Settings{% endblock %}
{% block content %}
<div style="display: flex; gap: 30px;">
    <!-- Tabs sidebar -->
    <div style="width: 200px; display: flex; flex-direction: column; gap: 5px;">
        <button style="padding: 12px 15px; border: none; background: var(--primary-color); color: white; border-radius: 6px; text-align: left; font-weight: bold; cursor: pointer;">General</button>
        <button style="padding: 12px 15px; border: none; background: transparent; color: var(--secondary-color); text-align: left; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">Security & Audit</button>
        <button style="padding: 12px 15px; border: none; background: transparent; color: var(--secondary-color); text-align: left; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">Webhooks</button>
        <button style="padding: 12px 15px; border: none; background: transparent; color: var(--secondary-color); text-align: left; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">API Keys</button>
    </div>

    <!-- Settings Forms -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
        <div class="card" style="margin-bottom: 0;">
            <h3 style="margin-top: 0; color: var(--secondary-color); border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">System Hardening (Phase 10)</h3>
            
            <div style="margin-top: 20px;">
                <label style="display: block; font-weight: 500; margin-bottom: 8px;">Global Rate Limit (requests/min)</label>
                <input type="number" value="100" style="width: 100%; max-width: 300px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>

            <div style="margin-top: 20px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--primary-color);"> Enable Global Webhooks
                </label>
            </div>
            
            <div style="margin-top: 15px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--primary-color);"> Enable Audit Diff Logs
                </label>
                <p style="margin-top: 5px; margin-left: 28px; color: #64748b; font-size: 0.9rem;">Keep detailed traces of pipeline configuration changes for compliance.</p>
            </div>
        </div>

        <div class="card" style="margin-bottom: 0;">
            <h3 style="margin-top: 0; color: var(--secondary-color); border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">Danger Zone</h3>
            <p style="color: #64748b; margin-top: 15px;">Irreversible operations that affect the entire workspace.</p>
            <button style="margin-top: 10px; padding: 10px 20px; background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; border-radius: 6px; font-weight: bold; cursor: pointer;">Purge All Telemetry Data</button>
        </div>
        
        <div>
            <button style="padding: 12px 24px; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; float: right;">Save Changes</button>
        </div>
    </div>
</div>
{% endblock %}
